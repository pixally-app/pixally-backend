
services: 
  app: 
    container_name: pixally-app
    build: .
    networks:
      - app
    ports:
      - "${PORT}:${PORT}"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pixally-db:5432/${POSTGRES_DB}
    volumes:
      - ./.env:/app/.env
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    container_name: pixally-db
    image: postgres:16-alpine
    networks:
      - app
    ports:
      - "127.0.0.1:${DB_PORT}:5432"
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  evolution-db:
    container_name: evolution-db
    image: postgres:16-alpine
    networks:
      - app
    environment:
      - POSTGRES_USER=evolution
      - POSTGRES_PASSWORD=${EVOLUTION_DB_PASSWORD}
      - POSTGRES_DB=evolution
    volumes:
      - evolution_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution -d evolution"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  evolution-redis:
    container_name: evolution-redis
    image: redis:7-alpine
    networks:
      - app
    volumes:
      - evolution_redis_data:/data

  evolution-api:
    container_name: evolution-api
    image: evoapicloud/evolution-api:latest
    networks:
      - app
    ports:
      - "8080:8080"
    depends_on:
      evolution-db:
        condition: service_healthy
      evolution-redis:
        condition: service_started
    environment:
      - SERVER_URL=${EVOLUTION_SERVER_URL}
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY}
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://evolution:${EVOLUTION_DB_PASSWORD}@evolution-db:5432/evolution?schema=evolution_api
      - DATABASE_CONNECTION_CLIENT_NAME=evolution
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://evolution-redis:6379/6
      - CACHE_REDIS_PREFIX_KEY=evolution
      - DEL_INSTANCE=false
      - LOG_LEVEL=ERROR
      - CORS_ORIGIN=*
      - TELEMETRY_ENABLED=false

volumes:
  db_data:
  evolution_db_data:
  evolution_redis_data:

networks:
  app:
    driver: bridge